<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ERROR WAVE</title>
    <style>
      /* Принудительно задаем размер окна расширения */
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 450px;   /* Ширина окна */
        height: 750px;  /* Высота окна (максимум для Chrome — 800, но лучше 750) */
        overflow: hidden; /* Убираем внешний скролл */
      }
      
      /* Внутренний контейнер для скролла, если треков много */
      .app {
        height: 100%;
        overflow-y: auto;
      }
      
      /* Скрываем стандартный скроллбар для красоты (по желанию) */
      .app::-webkit-scrollbar {
        width: 6px;
      }
      .app::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 3px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
